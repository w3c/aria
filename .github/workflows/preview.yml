name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changed-specs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      specs: ${{ steps.changes.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Find changed specs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node common/script/changedSpecs.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  validate:
    needs: changed-specs
    if: needs.changed-specs.outputs.specs != '[]'
    name: Validate ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed-specs.outputs.specs) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validation
        uses: w3c/spec-prod@v2
        with:
          TOOLCHAIN: respec
          SOURCE: ${{ matrix.source }}
          BUILD_FAIL_ON: error
          VALIDATE_MARKUP: true
          VALIDATE_WEBIDL: true
          ARTIFACT_NAME: spec-validator-${{ matrix.name }}

  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      
      - name: Install dependencies
        run: npm install axios yargs respec

      - name: Build site
        run: bash ./common/script/pr-preview.sh
      
      - name: Deploy site to Netlify
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: "./public"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: ${{ github.event.pull_request.title }}
          alias: deploy-preview-${{ github.event.number }}
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Update PR comment with preview and diff links
        env:
          SITE_NAME: wai-aria
        run: |
          node common/script/prComment.mjs \
            --repo ${{ github.repository }} \
            --pull_request_number ${{ github.event.pull_request.number }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --update_pr
